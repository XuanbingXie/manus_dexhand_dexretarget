retargeting:
  type: vector
  urdf_path: o6_left/linkerhand_o6_left.urdf

  # O6 只有 6 个主动关节，其他关节通过 mimic 约束自动跟随
  target_joint_names: [
    "thumb_cmc_yaw", "thumb_cmc_pitch",
    "index_mcp_pitch",
    "middle_mcp_pitch",
    "ring_mcp_pitch",
    "pinky_mcp_pitch"
  ]

  target_origin_link_names: [
    "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link", "hand_base_link"
  ]
  target_task_link_names: [
    "thumb_tip", "index_tip", "middle_tip", "ring_tip", "pinky_tip"
  ]
  scaling_factor: 1.0

  target_link_human_indices: [
    [0, 0, 0, 0, 0],
    [4, 9, 14, 19, 24]
  ]

  normal_delta: 0.005
  huber_delta: 0.02

  low_pass_alpha: 0.3
